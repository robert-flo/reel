[package]
name = "reel"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Pegas un enlace, elegis un formato, y la cola hace el resto."
repository = "https://github.com/robert-flo/reel"

[dependencies]
# `persistence` es lo que hace que la ventana recuerde su tamano y su
# posicion: `persist_window` ya viene en true, pero sin la feature no hace
# nada. Trae `ron` y `serde`, que es poco al lado de lo que ya pesa eframe.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
    "persistence",
] }
egui = "0.36"
# "http" es lo que sirve las miniaturas remotas; sin el, egui pinta su
# marca de error en vez de la imagen.
egui_extras = { version = "0.36", features = ["svg", "http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

fastframe-text   = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-fonts  = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-icons  = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-theme  = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-log    = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-shell  = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-tray   = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2", features = ["reqwest"] }

anyhow = "1"
log = "0.4"
# El cliente del actualizador lo construye la app, no la crate: aqui se
# eligen TLS y proxy. fastframe-update solo lo envuelve en su Transport.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[features]
# `--download-selfcheck`: pruebas de la cola con un yt-dlp falso, para
# comprobar la concurrencia y la cancelacion sin bajar nada. No va en el
# binario normal.
selfcheck = []

[profile.release]
lto = "thin"
strip = true

# Optimiza dependencias en desarrollo para evitar tirones y retardos de interfaz.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# crmne/egui apps-0.36 and crmne/winit apps-0.30, the revisions ZapFast 0.18.2
# and Spotifast 0.11.2 pin: Wayland frame pacing by compositor callbacks (a
# hidden window never blocks in a vsync swap under Hyprland), egui's busy-loop
# fix, and winit's Occluded state. Move all pins together with those apps.
ecolor = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
eframe = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
emath = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
winit = { git = "https://github.com/crmne/winit", rev = "544a73716c7a54c916d97d6c86c0b1bdaa81234e" }
